<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Team Task Reminder</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.44.0/tabler-icons.min.css" />
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        background: #f5f5f3;
        color: #1a1a18;
        min-height: 100vh;
      }
      :root {
        --color-background-primary: #ffffff;
        --color-background-secondary: #f1efe8;
        --color-background-tertiary: #f5f5f3;
        --color-text-primary: #1a1a18;
        --color-text-secondary: #5f5e5a;
        --color-text-tertiary: #888780;
        --color-border-tertiary: rgba(0,0,0,0.15);
        --color-border-secondary: rgba(0,0,0,0.3);
        --border-radius-md: 8px;
        --border-radius-lg: 12px;
        --font-sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --color-background-primary: #1e1e1c;
          --color-background-secondary: #2c2c2a;
          --color-background-tertiary: #141412;
          --color-text-primary: #f1efe8;
          --color-text-secondary: #b4b2a9;
          --color-text-tertiary: #888780;
          --color-border-tertiary: rgba(255,255,255,0.15);
          --color-border-secondary: rgba(255,255,255,0.3);
        }
        body { background: #141412; color: #f1efe8; }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
